name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Main Entry File Exists
        run: |
          if [ ! -f main.py ]; then
            cp mobile_app.py main.py
          fi

      - name: Install Build Tools & Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet requests

      - name: Build APK with Flet
        run: |
          flet build apk --project-name "visionpass" --org "com.visionpass.app"

      - name: Locate and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionPass-APK
          path: build/apk/*.apk
